# ==============================================================================
# 🦀 Sugie GitHub Triage Bot - Server & Rules Configuration (sugie.toml)
# Sensitive keys, tokens, and secrets are stored in .env and merged at runtime.
# ==============================================================================

host = "0.0.0.0"
port = 8800
db_path = "data/sugie.db"

# ------------------------------------------------------------------------------
# 1. GitHub App Base Settings
# (Sensitive credentials like webhook secret and private key are loaded from .env)
# ------------------------------------------------------------------------------
[github]
# app_id, webhook_secret, and private_key_path are loaded from .env

# ------------------------------------------------------------------------------
# 2. Notification Channels & Repository Routing
# ------------------------------------------------------------------------------
[notifications]
# Global repository filter: only events from these repositories trigger notifications.
# Leave commented or empty to allow all onboarded repositories.
allowed_repositories = [
    "StarLabsSI/ensia",
    "StarLabsSI/bincode"
]

[notifications.discord]
username = "sugie-bot"
# webhook_url is loaded from .env (SUGIE_DISCORD_WEBHOOK_URL)

[notifications.zulip]
site_url = "https://smartconnect.zulipchat.com"
bot_email = "apichtop-bot@smartconnect.zulipchat.com"
stream = "general"
topic_triage = "triage"
topic_reports = "reports"
topic_alerts = "alerts"
topic_assigns = "assignments"
# bot_api_key is loaded from .env (SUGIE_ZULIP_BOT_API_KEY)

[notifications.lark]
# webhook_url and secret are loaded from .env (SUGIE_LARK_WEBHOOK_URL, SUGIE_LARK_SignatureVerification)

# Granular event notification toggles
[notifications.events]
weekly_report = true
monthly_report = true
assigned = true
unassigned = true
issue_opened = true
issue_closed = true
issue_comment = true
pr_opened = true
pr_merged = true
label_changed = true
stale_warned = true
stale_closed = true
ci_failure = true
duplicate_detected = true
dco_failed = true
growth_milestone = true
cross_repo_move = true

# ------------------------------------------------------------------------------
# 3. Default Rules, Reviewers & Command Access Control
# ------------------------------------------------------------------------------
[default_rules.commands]
prefix = "/"
# Maintainers authorized to run restricted commands:
super_users = ["cn-starlabs"]
# Commands restricted to super users:
restricted_commands = [
    "assign",
    "unassign",
    "close",
    "reopen",
    "move",
    "duplicate",
    "project",
    "retest"
]

[default_rules.reviewers]
enabled = true
pool = ["cn-starlabs"]
reviewers_per_pr = 1
max_active_reviews = 5
load_balancing = "least_busy"

[default_rules.labels]
enabled = true

[default_rules.stale]
enabled = false
check_interval_hours = 24
days_until_stale = 60
days_until_close = 7
stale_label = "stale"
exempt_labels = ["pinned", "security", "in-progress"]
