[package]
name = "sugie"
version = "0.1.0"
edition = "2021"
authors = ["Sugie Bot Team"]
description = "A powerful, full-featured GitHub triage bot for the Rust ecosystem"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "json", "matched-path", "form", "query"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["trace", "cors", "timeout"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
reqwest = { version = "0.13", features = ["json", "form"] }
jsonwebtoken = { version = "11.1", features = ["rust_crypto"] }
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1.11"
globset = "0.4"
anyhow = "1.0"
thiserror = "2.0"
strsim = "0.11"
base64 = "0.23"
ed25519-dalek = "3.0"
aes = "0.9"
cbc = "0.2"

# --- Admin console (Leptos SSR + auth + config editing) ---
leptos = { version = "0.8", features = ["ssr"] }
argon2 = "0.6"
# OS randomness for session tokens and job ids. `argon2` pulls it in
# transitively, but a direct dependency is what lets us name it.
getrandom = "0.4"
toml_edit = "0.25"
async-stream = "0.3"
totp-rs = { version = "6.0", features = ["qr", "gen_secret", "otpauth"] }
qrcodegen-image = "1.5"
webauthn-rs = { version = "0.6", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# `webauthn-rs-core` links OpenSSL for attestation parsing. By default we use the
# system OpenSSL 3 (fast, no build-script compile). `--features vendored-openssl`
# builds a self-contained binary for images that ship no OpenSSL headers.
openssl = "0.10"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[features]
default = []
vendored-openssl = ["openssl/vendored"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
strip = true
debug = false
debug-assertions = false
overflow-checks = false
incremental = true

[dev-dependencies]
tempfile = "3.13"
