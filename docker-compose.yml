services:
  sugie:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./sugie.toml:/app/sugie.toml:ro
      - ./sugie.private-key.pem:/app/sugie.private-key.pem:ro
    environment:
      - RUST_LOG=info
      - SUGIE_DB_PATH=/app/data/sugie.db
